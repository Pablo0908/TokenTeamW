# Render Blueprint for the TokenTeamW Flask API.
# Deploy: Render dashboard -> New + -> Blueprint -> pick this repo on the Backend branch.
# Secret values (sync: false) are entered in the Render dashboard, never committed here.
services:
  - type: web
    name: tokenteamw-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DB_NAME
        value: beeworking
      - key: FLASK_ENV
        value: production
      # --- set these in the Render dashboard (copy from backend/.env) ---
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      # FRONTEND_URL / CORS_ORIGINS = your Vercel URL (set after the frontend deploys)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
